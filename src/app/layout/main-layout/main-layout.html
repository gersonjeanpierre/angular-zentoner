<div class="drawer lg:drawer-open">
  <input id="my-drawer-4" type="checkbox" class="drawer-toggle" />
  <div class="drawer-content">
    <!-- Navbar -->
    <header class="mr-2 my-2">
      <app-header [userName]="userName()"></app-header>
    </header>
    <!-- Main content -->
    <main>
      <router-outlet></router-outlet>
    </main>
  </div>

  <div class="drawer-side is-drawer-close:overflow-visible">
    <label for="my-drawer-4" aria-label="close sidebar" class="drawer-overlay"></label>
    <div
      class="flex flex-col items-start bg-base-200 is-drawer-close:w-24 is-drawer-open:w-[206px] h-screen"
    >
      <!-- Sidebar content here -->
      <app-sidebar (actionLogOut)="logOut()"></app-sidebar>
    </div>
  </div>
</div>
