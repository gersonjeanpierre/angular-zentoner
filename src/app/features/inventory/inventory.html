<div class="card rounded-lg shadow-md border border-base-200 bg-white mr-2 my-1 px-4 pt-4 pb-4">
  <div class="mb-3">
    <h1 class="text-2xl font-bold">{{ title() }}</h1>
    <p class="text-lg">Administra la configuración del inventario.</p>
  </div>
  <div class="flex gap-4 justify-center mt-8">
    <div
      class="border-black border-2 hover:bg-neutral hover:text-white cursor-pointer text-lg flex flex-col items-center justify-center p-6 rounded-lg w-40 h-40"
      (click)="toItems()"
    >
      <div class="flex items-center justify-center size-18">
        <span class="icon-[lets-icons--box-open-light] h-16 w-16"></span>
      </div>
      <span>Items</span>
    </div>
    <div
      class="border-black border-2 hover:bg-neutral hover:text-white cursor-pointer text-lg flex flex-col items-center justify-center p-6 rounded-lg w-40 h-40"
    >
      <span class="icon-[fluent--production-24-regular] h-15 w-15"></span>
      <span>Kardex</span>
    </div>
  </div>
  <div class="flex justify-center my-12">
    <figure class="w-86">
      <img src="/images/undraw_logistics_8vri.svg" alt="Imagen Referencial" />
    </figure>
  </div>
</div>
