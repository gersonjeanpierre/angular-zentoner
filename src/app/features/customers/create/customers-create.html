<div class="relative h-auto">
  <div class="max-w-2xl mx-auto pr-0 overflow-y-auto h-auto pl-2 pb-10 pt-1">
    <div class="card bg-base-100 shadow-sm">
      <div class="card-body">
        <h2 class="card-title text-2xl mb-4">Crear Cliente</h2>
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
            <label class="select select-neutral cursor-pointer">
              <span
                class="icon-[material-symbols--person-search-rounded] h-6 w-6 z-10 shadow-none"
              ></span>
              <select class="select grow shadow-none" formControlName="personType">
                <option value="" disabled>Tipo de persona</option>
                <option value="NATURAL">Natural</option>
                <option value="JURIDICA">Jurídica</option>
              </select>
            </label>

            <label class="select select-neutral cursor-pointer">
              <span
                class="icon-[material-symbols--frame-person-rounded] h-6 w-6 z-10 shadow-none"
              ></span>
              <select class="select grow shadow-none" formControlName="customerType">
                <option value="" disabled>Tipo de cliente</option>
                <option value="NUEVO">Nuevo</option>
                <option value="FRECUENTE">Frecuente</option>
                <option value="IMPRENTERO_NUEVO">Imprentero Nuevo</option>
                <option value="IMPRENTERO_FRECUENTE">Imprentero Frecuente</option>
              </select>
            </label>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-2">
            <fieldset class="fieldset">
              <legend class="fieldset-legend text-lg">Datos Personales</legend>

              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--person-edit-rounded] h-7 w-7"></span>
                <input class="grow" formControlName="firstName" placeholder="Nombres" />
              </label>
              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--person-edit-rounded] h-7 w-7"></span>
                <input class="grow" formControlName="lastName" placeholder="Apellidos" />
              </label>
              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--business-center] h-7 w-7"></span>
                <input class="grow" formControlName="legalName" placeholder="Razón social" />
              </label>
              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--phone-iphone] h-7 w-7"></span>
                <input class="grow" formControlName="phone" placeholder="Teléfono" required />
              </label>
            </fieldset>
            <fieldset class="fieldset">
              <legend class="fieldset-legend text-lg">Documentos</legend>
              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--id-card-rounded] h-7 w-7"></span>
                <input class="grow" formControlName="dni" placeholder="DNI" />
              </label>
              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--text-ad-rounded] h-7 w-7"></span>
                <input class="grow" formControlName="ce" placeholder="Carnet extranjería" />
              </label>
              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--newsmode-rounded] h-7 w-7"></span>
                <input class="grow" formControlName="ruc" placeholder="RUC" />
              </label>
              <label class="input input-neutral mb-2">
                <span class="icon-[material-symbols--mail-rounded] h-7 w-7"></span>
                <input class="grow" formControlName="email" placeholder="Email" type="email" />
              </label>
              <div class="flex gap-2 mb-2">
                <label class="input input-neutral grow">
                  <span class="icon-[material-symbols--barcode-reader-rounded] h-7 w-7"></span>
                  <input class="grow" formControlName="customerCode" placeholder="Código de Cliente" />
                </label>
                <button type="button" class="btn btn-neutral" (click)="generateCode()">
                  Generar
                </button>
              </div>
            </fieldset>
          </div>

          <!-- Campo notes como claves/valor dinámicas con FormArray -->
          <fieldset class="fieldset">
            <legend class="fieldset-legend text-lg">Notas (claves/valor)</legend>
            <div class="card bg-base-100 p-4 mb-2">
              <div formArrayName="notes">
                @for (note of notesArray.controls; track $index) {
                  <div [formGroupName]="$index" class="flex gap-2 mb-2 items-center">
                    <input
                      class="input input-bordered w-1/2"
                      formControlName="key"
                      placeholder="Clave"
                    />
                    <input
                      class="input input-bordered w-1/2"
                      formControlName="value"
                      placeholder="Valor"
                    />
                    <button type="button" class="btn btn-error btn-xs" (click)="removeNote($index)">
                      ✕
                    </button>
                  </div>
                }
              </div>
              <button type="button" class="btn btn-success btn-sm mt-2" (click)="addNote()">
                Agregar nota
              </button>
              <p class="label text-xs mt-1">
                Agrega pares clave/valor para información adicional. Se enviarán como JSON.
              </p>
            </div>
          </fieldset>
          <!-- Botón de envío -->
          <div class="mt-6">
            <button
              type="submit"
              class="btn btn-neutral btn-block"
              [disabled]="form.invalid || loading()"
            >
              @if (loading()) {
                <span class="loading loading-spinner"></span>
                <span>Creando Cliente ...</span>
              } @else {
                Crear Cliente
              }
            </button>
          </div>

          <!-- Alerta -->
          @if (error()) {
            <div class="alert alert-error mt-2">{{ error() }}</div>
          }
          @if (success()) {
            <div class="alert alert-success mt-2">Cliente creado correctamente</div>
          }
        </form>
      </div>
    </div>
  </div>
</div>
