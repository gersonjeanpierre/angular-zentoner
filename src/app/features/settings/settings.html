<div
  class="card rounded-lg shadow-md border border-base-200 bg-white ml-2 mr-3 my-1 px-4 pt-4 pb-16"
>
  <div class="breadcrumbs text-sm">
    <ul>
      <li><a>Home</a></li>
      <li><a>Documents</a></li>
      <li>Add Document</li>
    </ul>
  </div>
  <div class="mb-3">
    <h1 class="text-2xl font-bold">Configuración</h1>
    <p class="text-lg">Administra la configuración de la aplicación.</p>
  </div>
  <div
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 place-items-center justify-items-center"
  >
    <div class="flex flex-col items-center border-2 rounded-lg border-dashed w-full p-4">
      <h2 class="text-2xl font-medium mb-3">Gestión de Usuarios</h2>
      <button
        class="btn border bg-linear-to-tr from-rose-600 to-orange-300 text-white btn-wide hover:from-violet-600 hover:to-fuchsia-600 text-lg"
        (click)="toCreateUser()"
      >
        <span class="icon-[material-symbols--person-add-rounded] h-7 w-7"></span>
        Configurar
      </button>
    </div>

    <div class="flex flex-col items-center border-2 rounded-lg border-dashed w-full p-4">
      <h2 class="text-2xl font-medium mb-3">Gestión de Tiendas</h2>
      <button
        class="btn border bg-linear-to-bl from-violet-500 to-fuchsia-500 text-white btn-wide hover:from-violet-600 hover:to-fuchsia-600 text-lg"
        (click)="toShops()"
      >
        <span class="icon-[material-symbols--add-location-rounded] h-7 w-7"></span>
        Configurar
      </button>
    </div>
  </div>
</div>
