<div
  class="fixed inset-0 flex items-center justify-center z-50 modal-open"
  role="dialog"
  aria-modal="true"
  aria-labelledby="alert-title"
>
  <!-- overlay: semi-transparent + blur para efecto "enfoque" -->
  <div
    class="absolute inset-0 bg-black/50 backdrop-blur-sm"
    (click)="onClose()"
    (keydown.enter)="onClose()"
    (keydown.space)="onClose()"
    tabindex="0"
    role="button"
    aria-label="Close modal"
  ></div>

  <!-- modal box: DaisyUI modal-box con animación de aparición y anillo de foco -->
  <div
    #modalBox
    tabindex="0"
    class="relative bg-base-100 rounded-xl shadow-2xl p-6 w-full max-w-lg ring-1 ring-base-300 transform transition duration-200 ease-out scale-95 animate-in fade-in-60"
    [class]="ringClass()"
  >
    <div class="flex items-start justify-between gap-4 mb-4">
      <div class="flex items-center gap-3">
        <!-- iconos simples según tipo -->
        @switch (type()) {
          @case ('success') {
            <svg
              class="w-6 h-6 text-green-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          }
          @case ('error') {
            <svg class="w-6 h-6 text-red-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M6 18L18 6M6 6l12 12"
              />
            </svg>
          }
          @case ('warning') {
            <svg
              class="w-6 h-6 text-yellow-500"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01"
              />
            </svg>
          }
          @default {
            <svg
              class="w-6 h-6 text-blue-600"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M12 20.5A8.5 8.5 0 1 1 20.5 12 8.51 8.51 0 0 1 12 20.5z"
              />
            </svg>
          }
        }
        <h2 id="alert-title" class="text-lg font-semibold" [class]="textClass()">
          {{ title() }}
        </h2>
      </div>
    </div>

    <p class="text-sm text-base-content/80 mb-6">{{ message() }}</p>

    <div class="modal-action flex justify-end gap-2">
      <button type="button" (click)="onClose()" class="btn btn-neutral">OK</button>
    </div>
  </div>
</div>
